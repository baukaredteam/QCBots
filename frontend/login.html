<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSP Intelligence Workbench - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        .login-card h1 { color: #f8fafc; font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; text-align: center; }
        .login-card p { color: #94a3b8; font-size: 0.875rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #cbd5e1; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
        .form-group input { width: 100%; padding: 0.5rem; background: #334155; border: 1px solid #475569; border-radius: 0.375rem; color: #f8fafc; font-size: 0.875rem; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .btn { width: 100%; padding: 0.5rem; background: #3b82f6; border: none; border-radius: 0.375rem; color: #ffffff; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .error { color: #f87171; font-size: 0.75rem; margin-top: 0.25rem; display: none; }
        .footer { margin-top: 1.5rem; color: #94a3b8; font-size: 0.75rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>MSSP Intelligence Workbench</h1>
        <p>Sign in to your account</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="clientId">Client</label>
                <input type="text" id="clientId" name="clientId" placeholder="Client ID (e.g., client-alpha)" required>
            </div>
            <div id="loginError" class="error"></div>
            <button type="submit" class="btn" id="loginBtn">Sign in</button>
        </form>
        <div class="footer">MSSP Intelligence Workbench &mdash; On-premise CTI Platform</div>
    </div>
    <script>
        // Same-origin: the page and the API are served by the same backend.
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            btn.disabled = true; btn.textContent = 'Signing in...';
            errorDiv.style.display = 'none'; errorDiv.textContent = '';
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const clientId = document.getElementById('clientId').value;
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Origin': window.location.origin },
                    credentials: 'include',
                    body: JSON.stringify({ username, password, client_id: clientId })
                });
                if (response.ok) {
                    // Session is held in HttpOnly cookies; never store credentials in JS.
                    window.location.href = '/cases-list.html';
                } else {
                    const errorData = await response.json();
                    errorDiv.textContent = (errorData.error && errorData.error.message) || 'Login failed';
                    errorDiv.style.display = 'block';
                    btn.disabled = false; btn.textContent = 'Sign in';
                }
            } catch (err) {
                errorDiv.textContent = 'Network error. Is the backend running?';
                errorDiv.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
