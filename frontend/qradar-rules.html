<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSP Intelligence Workbench - QRadar Rules</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: #1e293b;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 1.5rem 1rem;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 1.5rem;
        }
        .sidebar nav a {
            display: block;
            padding: 0.5rem 0.75rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
        }
        .sidebar nav a:hover { background: #334155; color: #f8fafc; }
        .sidebar nav a.active { background: #3b82f6; color: #ffffff; }
        .nav-group { margin-top: 1rem; margin-bottom: 0.25rem; color: #64748b; font-size: 0.6875rem; text-transform: uppercase; font-weight: 600; padding: 0 0.75rem; }
        .main-content {
            margin-left: 260px;
            height: 100vh;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-badge { background: #334155; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; color: #cbd5e1; }
        .btn-logout {
            background: transparent; border: 1px solid #475569; color: #cbd5e1;
            padding: 0.375rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem;
        }
        .btn-logout:hover { background: #334155; border-color: #64748b; }
        .card {
            background: #1e293b; border-radius: 0.5rem; padding: 1.5rem;
            margin-bottom: 1rem; border: 1px solid #334155;
        }
        .card h3 { font-size: 1rem; font-weight: 600; color: #f8fafc; margin-bottom: 1rem; }
        .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .filters input, .filters select {
            background: #334155; border: 1px solid #475569; border-radius: 0.375rem;
            color: #f8fafc; padding: 0.5rem; font-size: 0.875rem;
        }
        .filters input { min-width: 220px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; color: #94a3b8; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; padding: 0.75rem 0.5rem; border-bottom: 1px solid #334155;
        }
        td {
            padding: 0.75rem 0.5rem; color: #cbd5e1; font-size: 0.875rem;
            border-bottom: 1px solid #334155; cursor: pointer;
        }
        tr:hover { background: #334155; }
        .badge {
            display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px;
            font-size: 0.6875rem; font-weight: 500;
        }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }
        .badge-unknown { background: #fef3c7; color: #92400e; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
        .empty-state h3 { color: #cbd5e1; margin-bottom: 0.5rem; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
            max-width: 720px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 1.5rem;
        }
        .modal h3 { color: #f8fafc; margin-bottom: 1rem; }
        .modal .close-btn {
            float: right; background: transparent; border: none; color: #94a3b8;
            font-size: 1.25rem; cursor: pointer;
        }
        .modal .field-row { margin-bottom: 0.75rem; }
        .modal .field-label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
        .modal .field-value { color: #cbd5e1; font-size: 0.875rem; margin-top: 0.125rem; word-break: break-word; }
        .modal ul { margin-left: 1.25rem; color: #cbd5e1; font-size: 0.875rem; }
        .loading { text-align: center; padding: 2rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MSSP Workbench</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <div class="nav-group">QRadar Inventory</div>
            <a href="qradar-rules.html" class="active">Detection Rules</a>
            <a href="qradar-building-blocks.html">Building Blocks</a>
            <a href="qradar-fields.html">Custom Fields</a>
            <a href="qradar-import.html">Import</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="header">
            <div class="user-info">
                <div class="user-badge" id="userBadge"></div>
                <span id="userName" style="color: #cbd5e1; font-size: 0.875rem;"></span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div class="card">
            <h3>QRadar Detection Rules</h3>
            <div class="filters">
                <input type="text" id="searchBox" placeholder="Search rules..." oninput="applyFilters()">
                <select id="criticalityFilter" onchange="applyFilters()">
                    <option value="">All Criticalities</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="logSourceFilter" onchange="applyFilters()">
                    <option value="">All Log Sources</option>
                </select>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Rule ID</th>
                            <th>Name</th>
                            <th>Criticality</th>
                            <th>Log Source</th>
                            <th>MITRE Techniques</th>
                            <th>Sysmon Required</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="rulesTableBody">
                        <tr><td colspan="7" class="loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">Rule Details</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_BASE = ""; // same-origin
        async function initSession() {
            try {
                const r = await fetch(`${API_BASE}/api/v1/auth/me`, { credentials: 'include', headers: { 'Origin': window.location.origin } });
                if (r.status === 401) { window.location.href = 'login.html'; return null; }
                return await r.json();
            } catch { window.location.href = 'login.html'; return null; }
        }
        let allRules = [];
        async function loadAPI(endpoint) {
            const response = await fetch(`${API_BASE}${endpoint}`, { credentials: 'include', headers: { 'Origin': window.location.origin } });
            if (response.status === 401) { window.location.href = 'login.html'; return null; }
            if (!response.ok) return null;
            return await response.json();
        }

        async function loadRules() {
            const me = await initSession(); if (!me) return;
            document.getElementById('userName').textContent = me.user.id;
            document.getElementById('userBadge').textContent = me.user.role;
            const data = await loadAPI('/api/v1/inventory/rules');
            const tbody = document.getElementById('rulesTableBody');
            tbody.innerHTML = '';
            if (!data || !data.rules || data.rules.length === 0) {
                const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 7; td.textContent = 'No rules found.'; tr.appendChild(td); tbody.appendChild(tr);
                return;
            }
            allRules = data.rules;
            // populate log source filter
            const lsSet = new Set();
            allRules.forEach(r => {
                (r.required_log_sources || '').split(/[;,]/).forEach(s => { const t = s.trim(); if (t) lsSet.add(t); });
            });
            const lsFilter = document.getElementById('logSourceFilter');
            lsSet.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.textContent = v;
                lsFilter.appendChild(opt);
            });
            applyFilters();
        }

        function criticalityOf(rule) {
            // not present in backend data; derive placeholder
            return 'unknown';
        }

        function sysmonRequired(rule) {
            const ls = (rule.required_log_sources || '').toLowerCase();
            return ls.includes('sysmon') ? 'Yes' : 'No';
        }

        function applyFilters() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const crit = document.getElementById('criticalityFilter').value.toLowerCase();
            const ls = document.getElementById('logSourceFilter').value.toLowerCase();
            const tbody = document.getElementById('rulesTableBody');
            tbody.innerHTML = '';

            const filtered = allRules.filter(r => {
                const text = `${r.rule_id} ${r.rule_name} ${r.mitre_techniques || ''}`.toLowerCase();
                if (search && !text.includes(search)) return false;
                if (ls && !(r.required_log_sources || '').toLowerCase().includes(ls)) return false;
                return true;
            });

            // If a criticality is selected but none match, show none; reset behavior: allow all when empty already handled
            if (filtered.length === 0) {
                const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 7; td.textContent = 'No rules match filters.'; tr.appendChild(td); tbody.appendChild(tr);
                return;
            }

            filtered.forEach(rule => {
                const row = document.createElement('tr');
                const statusClass = (rule.rule_status || '').toLowerCase() === 'active' ? 'active' : 'inactive';
                const add = (tag, text, cls) => { const el = document.createElement(tag); el.textContent = text; if (cls) el.className = cls; row.appendChild(el); return el; };
                add('td', rule.rule_id); add('td', rule.rule_name); add('td', '-', 'badge badge-unknown');
                add('td', rule.required_log_sources || '-'); add('td', rule.mitre_techniques || '-'); add('td', sysmonRequired(rule));
                const st = document.createElement('td'); const b = document.createElement('span'); b.className = 'badge badge-' + statusClass; b.textContent = rule.rule_status || '-'; st.appendChild(b); row.appendChild(st);
                row.addEventListener('click', () => showRuleModal(rule));
                tbody.appendChild(row);
            });
        }

        function showRuleModal(rule) {
            document.getElementById('modalTitle').textContent = rule.rule_name || 'Rule Details';
            const body = document.getElementById('modalBody');
            body.innerHTML = '';
            const fields = (rule.required_fields || '').split(/[;,]/).map(s=>s.trim()).filter(Boolean);
            function addField(label, value) {
                const row = document.createElement('div'); row.className = 'field-row';
                const l = document.createElement('div'); l.className = 'field-label'; l.textContent = label;
                const v = document.createElement('div'); v.className = 'field-value'; v.textContent = value || '-';
                row.appendChild(l); row.appendChild(v); body.appendChild(row);
            }
            addField('Rule ID', rule.rule_id);
            addField('Description', rule.rule_description || '-');
            addField('Type', rule.rule_type || '-');
            addField('MITRE Tactics', rule.mitre_tactics || '-');
            addField('MITRE Techniques', rule.mitre_techniques || '-');
            addField('Required Log Sources', rule.required_log_sources || '-');
            addField('Version', rule.rule_version || '-');
            addField('Last Updated', rule.last_updated || '-');
            const listRow = document.createElement('div'); listRow.className = 'field-row';
            const ll = document.createElement('div'); ll.className = 'field-label'; ll.textContent = 'Building Blocks Chain';
            const ul = document.createElement('ul');
            if (fields.length) { fields.forEach(f => { const li = document.createElement('li'); li.textContent = f; ul.appendChild(li); }); } else { const li = document.createElement('li'); li.textContent = '-'; ul.appendChild(li); }
            listRow.appendChild(ll); listRow.appendChild(ul); body.appendChild(listRow);
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal(e) {
            if (e && e.target && e.target.id !== 'modalOverlay') return;
            document.getElementById('modalOverlay').classList.remove('open');
        }

        async function logout() {
            await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include', headers: { 'Origin': window.location.origin } });
            window.location.href = 'login.html';
        }

        loadRules();
    </script>
</body>
</html>
