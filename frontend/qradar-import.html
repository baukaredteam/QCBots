<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSP Intelligence Workbench - QRadar Import</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1e293b; height: 100vh; position: fixed; left: 0; top: 0; padding: 1.5rem 1rem; border-right: 1px solid #334155; overflow-y: auto; }
        .sidebar h2 { font-size: 1.125rem; font-weight: 600; color: #f8fafc; margin-bottom: 1.5rem; }
        .sidebar nav a { display: block; padding: 0.5rem 0.75rem; color: #94a3b8; text-decoration: none; border-radius: 0.375rem; margin-bottom: 0.25rem; font-size: 0.875rem; }
        .sidebar nav a:hover { background: #334155; color: #f8fafc; }
        .sidebar nav a.active { background: #3b82f6; color: #ffffff; }
        .nav-group { margin-top: 1rem; margin-bottom: 0.25rem; color: #64748b; font-size: 0.6875rem; text-transform: uppercase; font-weight: 600; padding: 0 0.75rem; }
        .main-content { margin-left: 260px; height: 100vh; overflow-y: auto; padding: 1.5rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-badge { background: #334155; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; color: #cbd5e1; }
        .btn-logout { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 0.375rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
        .btn-logout:hover { background: #334155; border-color: #64748b; }
        .card { background: #1e293b; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
        .card h3 { font-size: 1rem; font-weight: 600; color: #f8fafc; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #cbd5e1; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.25rem; }
        .form-group input[type=file] { color: #cbd5e1; font-size: 0.875rem; }
        .btn { background: #3b82f6; border: none; border-radius: 0.375rem; color: #ffffff; padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .btn:disabled { background: #64748b; cursor: not-allowed; }
        .progress { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin: 1rem 0; display: none; }
        .progress-bar { height: 100%; width: 0%; background: #3b82f6; transition: width 0.2s; }
        .progress.indeterminate .progress-bar { width: 100%; animation: ind 1.2s infinite; }
        @keyframes ind { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .result { background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; display: none; }
        .result h4 { color: #f8fafc; margin-bottom: 0.5rem; }
        .result ul { margin-left: 1.25rem; color: #cbd5e1; font-size: 0.875rem; }
        .error { color: #f87171; font-size: 0.875rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MSSP Workbench</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <div class="nav-group">QRadar Inventory</div>
            <a href="qradar-rules.html">Detection Rules</a>
            <a href="qradar-building-blocks.html">Building Blocks</a>
            <a href="qradar-fields.html">Custom Fields</a>
            <a href="qradar-import.html" class="active">Import</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="header">
            <div class="user-info">
                <div class="user-badge" id="userBadge"></div>
                <span id="userName" style="color: #cbd5e1; font-size: 0.875rem;"></span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        <div class="card">
            <h3>Import QRadar Inventory (YAML)</h3>
            <div class="form-group">
                <label for="rulesFile">full_rules85.yaml</label>
                <input type="file" id="rulesFile" accept=".yaml,.yml,.json,.csv,.xlsx">
            </div>
            <div class="form-group">
                <label for="bbsFile">shared_bbs.yaml</label>
                <input type="file" id="bbsFile" accept=".yaml,.yml,.json,.csv,.xlsx">
            </div>
            <div class="form-group">
                <label for="fieldsFile">fields.yaml</label>
                <input type="file" id="fieldsFile" accept=".yaml,.yml,.json,.csv,.xlsx">
            </div>
            <button class="btn" id="importBtn" onclick="doImport()">Import</button>
            <div class="progress" id="progress"><div class="progress-bar"></div></div>
            <div id="error" class="error"></div>
            <div class="result" id="result">
                <h4>Import Results</h4>
                <ul id="resultList"></ul>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = ""; // same-origin
        const sessionId = sessionStorage.getItem('sessionId');
        if (!sessionId) { window.location.href = 'login.html'; }
        document.getElementById('userName').textContent = sessionStorage.getItem('userId') || '';
        document.getElementById('userBadge').textContent = sessionStorage.getItem('userRole') || '';

        async function doImport() {
            const btn = document.getElementById('importBtn');
            const progress = document.getElementById('progress');
            const errorDiv = document.getElementById('error');
            const result = document.getElementById('result');
            errorDiv.textContent = '';
            result.style.display = 'none';

            const rulesFile = document.getElementById('rulesFile').files[0];
            const bbsFile = document.getElementById('bbsFile').files[0];
            const fieldsFile = document.getElementById('fieldsFile').files[0];

            if (!rulesFile && !bbsFile && !fieldsFile) {
                errorDiv.textContent = 'Please select at least one file.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Importing...';
            progress.style.display = 'block';
            progress.classList.add('indeterminate');

            const formData = new FormData();
            if (rulesFile) formData.append('rules', rulesFile);
            if (bbsFile) formData.append('building_blocks', bbsFile);
            if (fieldsFile) formData.append('fields', fieldsFile);

            try {
                const response = await fetch(`${API_BASE}/api/v1/inventory/import`, {
                    method: 'POST',
                    headers: {
                        'Cookie': `session_id=${sessionId}`,
                        'Origin': window.location.origin
                    },
                    body: formData
                });
                progress.classList.remove('indeterminate');
                progress.style.display = 'none';

                if (response.ok) {
                    const data = await response.json();
                    const list = document.getElementById('resultList');
                    list.innerHTML = '';
                    const items = [
                        `Rules imported: ${data.rules_imported ?? data.rules ?? 0}`,
                        `Building blocks imported: ${data.bbs_imported ?? data.building_blocks ?? 0}`,
                        `Fields imported: ${data.fields_imported ?? data.fields ?? 0}`
                    ];
                    items.forEach(t => { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); });
                    if (data.import_id) {
                        const li = document.createElement('li'); li.textContent = `Import job: ${data.import_id}`; list.appendChild(li);
                    }
                    result.style.display = 'block';
                } else {
                    const errData = await response.json().catch(() => ({}));
                    errorDiv.textContent = errData.error?.message || `Import failed (${response.status})`;
                }
            } catch (err) {
                progress.classList.remove('indeterminate');
                progress.style.display = 'none';
                errorDiv.textContent = 'Network error. Is the backend running?';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Import';
            }
        }

        async function logout() {
            await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', headers: { 'Cookie': `session_id=${sessionId}`, 'Origin': window.location.origin } });
            sessionStorage.clear(); window.location.href = 'login.html';
        }
    </script>
</body>
</html>
