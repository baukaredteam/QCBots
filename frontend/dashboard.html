<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSP Intelligence Workbench - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: #1e293b;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            padding: 1.5rem 1rem;
            border-right: 1px solid #334155;
        }
        .sidebar h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 1.5rem;
        }
        .sidebar nav a {
            display: block;
            padding: 0.5rem 0.75rem;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            font-size: 0.875rem;
        }
        .sidebar nav a:hover {
            background: #334155;
            color: #f8fafc;
        }
        .sidebar nav a.active {
            background: #3b82f6;
            color: #ffffff;
        }
        .main-content {
            margin-left: 260px;
            height: 100vh;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .user-badge {
            background: #334155;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            color: #cbd5e1;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
        }
        .btn-logout:hover {
            background: #334155;
            border-color: #64748b;
        }
        .card {
            background: #1e293b;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }
        .card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 1rem;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid #334155;
        }
        td {
            padding: 0.75rem 0.5rem;
            color: #cbd5e1;
            font-size: 0.875rem;
            border-bottom: 1px solid #334155;
        }
        tr:hover {
            background: #334155;
        }
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.6875rem;
            font-weight: 500;
        }
        .badge-analyzed { background: #dbeafe; color: #1e40af; }
        .badge-approved { background: #dcfce7; color: #166534; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
        }
        .empty-state h3 {
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MSSP Workbench</h2>
        <nav>
            <a href="#" class="active" onclick="loadSection('dashboard', event)">Dashboard</a>
            <a href="#" onclick="loadSection('cti', event)">CTI Feed</a>
            <div style="margin-top:1rem; margin-bottom:0.25rem; color:#64748b; font-size:0.6875rem; text-transform:uppercase; font-weight:600; padding:0 0.75rem;">QRadar Inventory</div>
            <a href="qradar-rules.html">Detection Rules</a>
            <a href="qradar-building-blocks.html">Building Blocks</a>
            <a href="qradar-fields.html">Custom Fields</a>
            <a href="qradar-import.html">Import</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="header">
            <div class="user-info">
                <div class="user-badge" id="userBadge"></div>
                <span id="userName" style="color: #cbd5e1; font-size: 0.875rem;"></span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        
        <div id="dashboardSection">
            <div class="card">
                <h3>CTI Reports</h3>
                <div id="ctiTableContainer">
                    <table>
                        <thead>
                            <tr>
                                <th>Report ID</th>
                                <th>Title</th>
                                <th>Status</th>
                                <th>Collection Date</th>
                                <th>Checksum</th>
                            </tr>
                        </thead>
                        <tbody id="ctiTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="ctiSection" style="display: none;">
            <div class="card">
                <h3>CTI Feed</h3>
                <div class="empty-state">
                    <h3>CTI Feed</h3>
                    <p>CTI ingestion will be available in Phase 3.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = ""; // same-origin
        
        const API_BASE = ""; // same-origin
        async function initSession() {
            try {
                const r = await fetch(`${API_BASE}/api/v1/auth/me`, { credentials: 'include', headers: { 'Origin': window.location.origin } });
                if (r.status === 401) { window.location.href = 'login.html'; return null; }
                const me = await r.json();
                return me;
            } catch (e) { window.location.href = 'login.html'; return null; }
        }
        async function loadAPI(endpoint) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                credentials: 'include',
                headers: { 'Origin': window.location.origin }
            });
            if (response.status === 401) { window.location.href = 'login.html'; return null; }
            return await response.json();
        }

        async function loadCTIReports() {
            const me = await initSession();
            if (!me) return;
            const clientId = me.client_id;
            document.getElementById('userName').textContent = me.user.id;
            document.getElementById('userBadge').textContent = me.user.role;
            const data = await loadAPI(`/api/v1/tenants/${clientId}/cti/reports`);
            if (!data) return;
            const tbody = document.getElementById('ctiTableBody');
            tbody.innerHTML = '';
            if (data.reports.length === 0) {
                const tr = document.createElement('tr'); const td = document.createElement('td');
                td.colSpan = 5; td.textContent = 'No CTI reports found.'; tr.appendChild(td); tbody.appendChild(tr);
                return;
            }
            data.reports.forEach(report => {
                const row = document.createElement('tr');
                const add = (tag, text) => { const el = document.createElement(tag); el.textContent = text; row.appendChild(el); return el; };
                add('td', report.report_id);
                add('td', report.title);
                const statusTd = document.createElement('td'); const badge = document.createElement('span');
                badge.className = 'badge badge-' + report.status.toLowerCase(); badge.textContent = report.status; statusTd.appendChild(badge); row.appendChild(statusTd);
                add('td', report.collection_date || '-');
                add('td', report.checksum);
                tbody.appendChild(row);
            });
        }

        function loadSection(section, event) {
            if (event) event.preventDefault();
            
            // Update nav
            document.querySelectorAll('.sidebar nav a').forEach(a => {
                a.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Hide all sections
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('ctiSection').style.display = 'none';
            
            // Show selected section
            if (section === 'dashboard') {
                document.getElementById('dashboardSection').style.display = 'block';
                loadCTIReports();
            } else if (section === 'cti') {
                document.getElementById('ctiSection').style.display = 'block';
            }
        }

        async function logout() {
            await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include', headers: { 'Origin': window.location.origin } });
            window.location.href = 'login.html';
        }

        // Load dashboard on page load
        loadCTIReports();
    </script>
</body>
</html>
