<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSSP Intelligence Workbench - QRadar Building Blocks</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden;
        }
        .sidebar { width: 260px; background: #1e293b; height: 100vh; position: fixed; left: 0; top: 0; padding: 1.5rem 1rem; border-right: 1px solid #334155; overflow-y: auto; }
        .sidebar h2 { font-size: 1.125rem; font-weight: 600; color: #f8fafc; margin-bottom: 1.5rem; }
        .sidebar nav a { display: block; padding: 0.5rem 0.75rem; color: #94a3b8; text-decoration: none; border-radius: 0.375rem; margin-bottom: 0.25rem; font-size: 0.875rem; }
        .sidebar nav a:hover { background: #334155; color: #f8fafc; }
        .sidebar nav a.active { background: #3b82f6; color: #ffffff; }
        .nav-group { margin-top: 1rem; margin-bottom: 0.25rem; color: #64748b; font-size: 0.6875rem; text-transform: uppercase; font-weight: 600; padding: 0 0.75rem; }
        .main-content { margin-left: 260px; height: 100vh; overflow-y: auto; padding: 1.5rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-badge { background: #334155; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; color: #cbd5e1; }
        .btn-logout { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 0.375rem 0.75rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
        .btn-logout:hover { background: #334155; border-color: #64748b; }
        .card { background: #1e293b; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
        .card h3 { font-size: 1rem; font-weight: 600; color: #f8fafc; margin-bottom: 1rem; }
        .filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
        .filters select { background: #334155; border: 1px solid #475569; border-radius: 0.375rem; color: #f8fafc; padding: 0.5rem; font-size: 0.875rem; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #94a3b8; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; padding: 0.75rem 0.5rem; border-bottom: 1px solid #334155; }
        td { padding: 0.75rem 0.5rem; color: #cbd5e1; font-size: 0.875rem; border-bottom: 1px solid #334155; cursor: pointer; }
        tr:hover { background: #334155; }
        .group-header { background: #0f172a; color: #94a3b8; font-weight: 600; font-size: 0.8125rem; padding: 0.5rem; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 500; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-inactive { background: #fee2e2; color: #991b1b; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; max-width: 720px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 1.5rem; }
        .modal h3 { color: #f8fafc; margin-bottom: 1rem; }
        .modal .close-btn { float: right; background: transparent; border: none; color: #94a3b8; font-size: 1.25rem; cursor: pointer; }
        .modal .field-row { margin-bottom: 0.75rem; }
        .modal .field-label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
        .modal .field-value { color: #cbd5e1; font-size: 0.875rem; margin-top: 0.125rem; word-break: break-word; }
        .modal pre { background: #0f172a; padding: 0.75rem; border-radius: 0.375rem; color: #cbd5e1; font-size: 0.8125rem; overflow-x: auto; white-space: pre-wrap; }
        .loading { text-align: center; padding: 2rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MSSP Workbench</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <div class="nav-group">QRadar Inventory</div>
            <a href="qradar-rules.html">Detection Rules</a>
            <a href="qradar-building-blocks.html" class="active">Building Blocks</a>
            <a href="qradar-fields.html">Custom Fields</a>
            <a href="qradar-import.html">Import</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="header">
            <div class="user-info">
                <div class="user-badge" id="userBadge"></div>
                <span id="userName" style="color: #cbd5e1; font-size: 0.875rem;"></span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        <div class="card">
            <h3>QRadar Building Blocks</h3>
            <div class="filters">
                <label style="color:#94a3b8; font-size:0.875rem;">Group by:
                    <select id="groupBy" onchange="renderTable()">
                        <option value="level">Level</option>
                        <option value="category">Category</option>
                    </select>
                </label>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>BB ID</th>
                            <th>Name</th>
                            <th>Level</th>
                            <th>Category</th>
                            <th>Adversary Control</th>
                            <th>Availability</th>
                        </tr>
                    </thead>
                    <tbody id="bbTableBody">
                        <tr><td colspan="6" class="loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 id="modalTitle">Building Block Details</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_BASE = ""; // same-origin
        const sessionId = sessionStorage.getItem('sessionId');
        if (!sessionId) { window.location.href = 'login.html'; }
        document.getElementById('userName').textContent = sessionStorage.getItem('userId') || '';
        document.getElementById('userBadge').textContent = sessionStorage.getItem('userRole') || '';

        let allBBs = [];

        async function loadAPI(endpoint) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                headers: { 'Cookie': `session_id=${sessionId}`, 'Origin': window.location.origin }
            });
            if (response.status === 401) { sessionStorage.clear(); window.location.href = 'login.html'; return null; }
            if (!response.ok) return null;
            return await response.json();
        }

        async function loadBBs() {
            const data = await loadAPI('/api/v1/inventory/rules');
            const tbody = document.getElementById('bbTableBody');
            tbody.innerHTML = '';
            if (!data || !data.rules) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No building blocks found.</td></tr>';
                return;
            }
            // treat rules of type building_block as BBs; fall back to all rules
            const bbs = data.rules.filter(r => (r.rule_type || '').toLowerCase().includes('building') || (r.rule_type || '').toLowerCase().includes('bb'));
            allBBs = (bbs.length ? bbs : data.rules).map(r => ({
                bb_id: r.rule_id,
                name: r.rule_name,
                level: r.rule_type || '-',
                category: (r.mitre_tactics || '-').toString(),
                adversary_control: '-',
                availability: r.rule_status || '-',
                _raw: r
            }));
            renderTable();
        }

        function renderTable() {
            const groupBy = document.getElementById('groupBy').value;
            const tbody = document.getElementById('bbTableBody');
            tbody.innerHTML = '';
            if (allBBs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8;">No building blocks found.</td></tr>';
                return;
            }
            const groups = {};
            allBBs.forEach(bb => {
                const key = groupBy === 'level' ? bb.level : bb.category;
                (groups[key] = groups[key] || []).push(bb);
            });
            Object.keys(groups).sort().forEach(key => {
                const headerRow = document.createElement('tr');
                headerRow.innerHTML = `<td colspan="6" class="group-header">${escapeHtml(key)} (${groups[key].length})</td>`;
                tbody.appendChild(headerRow);
                groups[key].forEach(bb => {
                    const row = document.createElement('tr');
                    const statusClass = (bb.availability || '').toLowerCase() === 'active' ? 'active' : 'inactive';
                    row.innerHTML = `
                        <td><code>${bb.bb_id}</code></td>
                        <td>${bb.name}</td>
                        <td>${bb.level}</td>
                        <td>${bb.category}</td>
                        <td>${bb.adversary_control}</td>
                        <td><span class="badge badge-${statusClass}">${bb.availability}</span></td>
                    `;
                    row.addEventListener('click', () => showBBModal(bb));
                    tbody.appendChild(row);
                });
            });
        }

        function showBBModal(bb) {
            const r = bb._raw;
            document.getElementById('modalTitle').textContent = bb.name || 'Building Block Details';
            const body = document.getElementById('modalBody');
            const ownConditions = (r.required_fields || '').split(/[;,]/).map(s=>s.trim()).filter(Boolean);
            const fullLogic = r.rule_description || '-';
            body.innerHTML = `
                <div class="field-row"><div class="field-label">BB ID</div><div class="field-value"><code>${bb.bb_id}</code></div></div>
                <div class="field-row"><div class="field-label">Level</div><div class="field-value">${bb.level}</div></div>
                <div class="field-row"><div class="field-label">Category</div><div class="field-value">${bb.category}</div></div>
                <div class="field-row"><div class="field-label">Adversary Control</div><div class="field-value">${bb.adversary_control}</div></div>
                <div class="field-row"><div class="field-label">Availability</div><div class="field-value">${bb.availability}</div></div>
                <div class="field-row"><div class="field-label">Own Conditions</div><ul>${ownConditions.length ? ownConditions.map(c=>`<li>${escapeHtml(c)}</li>`).join('') : '<li>-</li>'}</ul></div>
                <div class="field-row"><div class="field-label">Full BB Logic</div><pre>${escapeHtml(fullLogic)}</pre></div>
                <div class="field-row"><div class="field-label">Required Log Sources</div><div class="field-value">${r.required_log_sources || '-'}</div></div>
                <div class="field-row"><div class="field-label">MITRE Techniques</div><div class="field-value">${r.mitre_techniques || '-'}</div></div>
            `;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal(e) {
            if (e && e.target && e.target.id !== 'modalOverlay') return;
            document.getElementById('modalOverlay').classList.remove('open');
        }

        function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        async function logout() {
            await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', headers: { 'Cookie': `session_id=${sessionId}`, 'Origin': window.location.origin } });
            sessionStorage.clear(); window.location.href = 'login.html';
        }

        loadBBs();
    </script>
</body>
</html>
